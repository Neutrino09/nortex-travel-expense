# Works on any machine with Docker: `docker compose up --build` (no .env needed).
# Port: http://localhost:8000 by default; if that is taken, use ./run.sh (picks a free one)
# or `HOST_PORT=9000 docker compose up --build`.
services:
  app:
    build: .
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      # Values come from your shell or a .env file next to this file; the defaults make it run as-is.
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      APP_TODAY: ${APP_TODAY:-2026-06-22}      # freezes "today" so the June 2026 demo trip isn't late
      COOKIE_SECURE: ${COOKIE_SECURE:-false}   # keep false on plain http://localhost
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}      # optional: cached extractions cover the sample pack
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      PACK_DIR: /app/pack
      DATABASE_URL: sqlite:///./data/app.db
    volumes:
      - ./data:/app/backend/data   # SQLite file + uploaded evidence survive restarts
    restart: unless-stopped
