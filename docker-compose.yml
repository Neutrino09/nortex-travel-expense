services:
  app:
    build: .
    ports:
      - "8001:8000"   # host 8001: port 8000 was taken by another local app
    env_file: .env            # copy .env.example to .env first
    environment:
      PACK_DIR: /app/pack     # overrides the local ../pack in .env
      DATABASE_URL: sqlite:///./data/app.db
    volumes:
      - ./data:/app/backend/data   # SQLite file + uploaded evidence survive restarts
